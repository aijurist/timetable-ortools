meta:
  name: combined_scheduler
  version: "1.0.0"
  environment: legacy
  generated_at: null

paths:
  courses_csv: data/department_data/core-v3/Computer_Science_and_Engineering_v3.0.csv
  rooms_csv: data/block_wise/techlongue.csv
  day_order_csv: data/day_order.csv
  core_lab_mapping_csv: data/og-final.csv
  preferences_csv: data/pop.csv
  output_root: output/combined_scheduler

data:
  encoding: utf-8
  delimiter: ","
  quotechar: '"'
  required_columns:
    courses:
      - course_code
      - course_name
      - department
      - semester
      - teacher
      - student_count
    rooms:
      - room_number
      - capacity
      - block
  optional_columns:
    courses:
      - teaching_dept
      - course_type
      - sessions_lab
      - sessions_theory
      - sessions_tutorial
    rooms:
      - room_type
      - equipment
  trim_strings: true
  fill_missing_with:
    teacher: TBD
    course_type: elective

time:
