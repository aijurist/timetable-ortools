    session_coverage:
      enabled: true
      priority: 10
      weight: 1.0
      params: {}
    first_year_computer_lab_rooms:
      enabled: false
      priority: 9
      weight: 1.0
      params:
        allowed_rooms:
          - DG02
          - DG03
          - TIFAC I01
          - C401
          - KSL02
        target_semesters:
          - 1
          - 2
        room_keywords:
