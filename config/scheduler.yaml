preprocessing:
  enable_visualizations: false
  fill_missing_students: true
  student_cap: 120
  normalise_teacher_names: true
  normalise_department_names: true
  deduplicate_courses: true

grouping:
  strategy: exact
  max_groups_per_dept_sem: 6
  hall_theorem_tolerance: 0.05
  consecutive_lab_pairs: true
  random_seed: 42

constraints:
  lab:
    session_coverage:
      enabled: true
      priority: 10
      weight: 1.0
      params: {}
    room_capacity:
      enabled: true
      priority: 9
      weight: 1.0
      params: {}
    room_single_assignment:
      enabled: true
      priority: 9
      weight: 1.0
      params: {}
    core_lab_mapping:
      enabled: true
      priority: 8
      weight: 0.8
      params: {}
    core_group_slot_cap:
      enabled: false
      priority: 7
      weight: 0.6
      params:
        slot_limit: 8
        penalty_weight: 200
    computing_group_slot_cap:
      enabled: false
      priority: 8
      weight: 1.0
      params:
        slot_limit: 6
    semester_slot_cap:
      enabled: false
      priority: 8
      weight: 0.8
      params:
        slot_limit: 15
    shift_alignment:
      enabled: true
      priority: 9
      weight: 0.9
      params:
        shift_templates:
          - SHIFT_1
          - SHIFT_2
    teacher_max_consecutive:
      enabled: true
      priority: 8
      weight: 0.6
      params:
        max_consecutive_sessions: 2
        soft_penalty_weight: 5
        soft_departments:
          - Biotechnology
    consecutive_batches:
      enabled: true
      priority: 7
      weight: 1.0
      params:
        course_codes: ['BT23523']
        preferred_pairs:
          - [L1, L2]
          - [L3, L4]
          - [L5, L6]
        min_practical_hours: 4
        min_student_count: 36
    teacher_daily_presence_lab:
      enabled: true
      priority: 8
      weight: 0.7
      params:
        max_daily_sessions: 2
        early_sessions:
          - L1
        buffer_sessions:
          - L5
        late_sessions:
          - L5
  theory:
    slot_coverage:
      enabled: true
      priority: 10
      weight: 1.0
      params: {}
    course_daily_limit:
      enabled: true
      priority: 9
      weight: 1.0
      params:
        max_daily_slots: 2
    daily_slot_cap:
      enabled: false
      priority: 9
      weight: 0.9
      params: {}
    no_three_consecutive:
      enabled: true
      priority: 8
      weight: 0.7
      params:
        window: 3
    teacher_daily_limit:
      enabled: false
      priority: 9
      weight: 1.0
      params: {}
    student_conflict:
      enabled: false
      priority: 10
      weight: 1.0
      params: {}
    room_assignment:
      enabled: true
      priority: 8
      weight: 0.7
      params:
        big_capacity_threshold: 140
        overflow_penalty: 5
        default_blocks:
          - A Block
          - B Block
          - C Block
        senior_blocks:
          - A Block
          - B Block
        second_year_blocks:
          - B Block
          - C Block
        year_block_preferences:
          "2":
            - B Block
          "3":
            - A Block
          "4":
            - A Block
    shift_alignment:
      enabled: true
      priority: 8
      weight: 0.6
      params:
