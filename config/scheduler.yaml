      weight: 1.0
      params: {}
    room_single_assignment:
      enabled: true
      priority: 9
      weight: 1.0
      params: {}
    core_lab_mapping:
      enabled: true
      priority: 8
      weight: 0.8
      params: {}
    core_group_slot_cap:
