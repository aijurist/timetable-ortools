          - [L1, L2]
          - [L3, L4]
          - [L5, L6]
        min_practical_hours: 4
        min_student_count: 36
    teacher_daily_presence_lab:
      enabled: true
      priority: 8
      weight: 0.7
      params:
        max_daily_sessions: 2
        early_sessions:
          - L1
        buffer_sessions:
          - L5
        late_sessions:
