      - course_name
      - department
      - semester
      - teacher
      - student_count
    rooms:
      - room_number
      - capacity
      - block
  optional_columns:
    courses:
      - teaching_dept
      - course_type
      - sessions_lab
      - sessions_theory
      - sessions_tutorial
    rooms:
      - room_type
      - equipment
  trim_strings: true
  fill_missing_with:
