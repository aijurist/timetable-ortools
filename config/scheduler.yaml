    shift_pattern:
      enabled: true
      priority: 8
      weight: 0.7
      params:
        shift_templates:
          - SHIFT_1
          - SHIFT_2
        allowed_patterns:
          - [3, 2]
          - [2, 3]
        penalty_weight: 15

model:
  big_m_value: 1000.0
  objective_weights:
    __default__: 1.0
    lab_balance: 0.9
    theory_balance: 1.0
    teacher_spread: 2.4
    room_spread: 1.7
  slack_penalty: 1.0
  use_sparse_variables: true

runtime:
  time_limit_sec: 600
  thread_count: 14
  enable_lns: true
  enable_trace: true
  solution_limit: null
  stop_after_first_solution: false
  probing_level: 0
  search_branching: FIXED_SEARCH
  restart_log_size: 18.0
  max_number_of_conflicts: 150000
  warm_start:
    enabled: true
    snapshot_dir: output/combined_scheduler/warm_start_cache
    max_hint_literals: 5000
    max_snapshot_age_hours: 168
    require_signature_match: false

logging:
  level: INFO
  log_file: output/combined_scheduler/scheduler.log
  structured: false

validation:
  enforce_room_capacity: true
  enforce_teacher_continuity: true
  max_conflicts_allowed: 0
