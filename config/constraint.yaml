metadata:
	source: combined_scheduler
	generated_at: "2025-11-14"

lab:
	session_coverage:
		enabled: true
		priority: 10
		weight: 1.0
		description: Ensure each lab group receives the required number of sessions.
	room_capacity:
		enabled: true
		priority: 9
		weight: 1.0
		description: Prevent assigning labs to rooms below required capacity.
		room_single_assignment:
			enabled: true
			priority: 9
			weight: 1.0
			description: Prevent double-booking rooms or courses within a lab session.
	core_lab_mapping:
		enabled: true
		priority: 8
		weight: 0.8
		description: Preserve legacy core-lab to room associations.
	shift_alignment:
		enabled: true
		priority: 9
		weight: 0.9
		description: Keep lab scheduling aligned with department shift patterns.
	teacher_max_consecutive:
		enabled: true
		priority: 8
		weight: 0.6
		description: Limit teachers to at most two consecutive lab sessions (soft override for select departments).
		params:
			max_consecutive_sessions: 2
			soft_penalty_weight: 5
			soft_departments:
				- Biotechnology

theory:
	slot_coverage:
		enabled: true
		priority: 10
		weight: 1.0
		description: Ensure each theory group receives its exact weekly slot requirement.
	daily_slot_cap:
		enabled: true
		priority: 9
		weight: 0.9
		description: Limit theory slot variety per department per day.
	no_three_consecutive:
		enabled: true
		priority: 8
		weight: 0.7
		description: Prevent three consecutive theory slots for any group.
	teacher_daily_limit:
		enabled: true
		priority: 9
		weight: 1.0
		description: Limit theory load per teacher per day.
	student_conflict:
		enabled: true
		priority: 10
		weight: 1.0
		description: Avoid overlap between sessions taken by the same student group.
	room_capacity:
		enabled: true
		priority: 8
		weight: 0.7
		description: Respect lecture hall capacities for all theory sessions.
	shift_alignment:
		enabled: true
		priority: 8
		weight: 0.6
		description: Align theory sessions with department shift windows.

cross_system:
	teacher_overlap:
		enabled: true
		priority: 10
		weight: 1.0
		description: Prevent teachers from being double-booked across lab and theory.
	lunch_alignment:
		enabled: true
		priority: 6
		weight: 0.4
		description: Maintain common lunch breaks to match combined scheduler defaults.
	five_pm_policy:
		enabled: true
		priority: 7
		weight: 0.5
