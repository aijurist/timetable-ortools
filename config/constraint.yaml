metadata:
	source: combined_scheduler
	generated_at: "2025-11-14"

lab:
	session_coverage:
		enabled: true
		priority: 10
		weight: 1.0
		description: Ensure each lab group receives the required number of sessions.
	room_capacity:
		enabled: true
		priority: 9
		weight: 1.0
		description: Prevent assigning labs to rooms below required capacity.
	core_lab_mapping:
		enabled: true
		priority: 8
		weight: 0.8
		description: Preserve legacy core-lab to room associations.
	shift_alignment:
		enabled: true
		priority: 9
		weight: 0.9
		description: Keep lab scheduling aligned with department shift patterns.

theory:
	slot_coverage:
		enabled: true
		priority: 10
		weight: 1.0
		description: Ensure each theory group receives its exact weekly slot requirement.
	daily_slot_cap:
		enabled: true
		priority: 9
		weight: 0.9
		description: Limit theory slot variety per department per day.
	no_three_consecutive:
		enabled: true
		priority: 8
		weight: 0.7
		description: Prevent three consecutive theory slots for any group.
	lunch_window:
		enabled: true
		priority: 8
		weight: 0.6
		description: Reserve at least one lunch slot for non-flexible departments.
		params:
			fallback_window:
				- 3
				- 4
				- 5
			minimum_free_slots: 1
	flexible_lunch:
		enabled: true
		priority: 7
		weight: 0.5
		description: Allow flexible departments to satisfy lunch via natural lab/theory patterns.
		params:
			traditional_slots:
				- 3
				- 4
				- 5
			min_traditional_free_slots: 1
			natural_patterns:
				- lab_session: L3
				  required_theory_slots: [6]
				  description: L3 lab plus theory slot 6 keeps lunch before slot 7
				- lab_session: L4
				  required_theory_slots: [4]
				  description: Theory slot 4 combined with L4 lab preserves middle-day lunch
	teacher_daily_limit:
		enabled: true
		priority: 9
		weight: 1.0
		description: Limit theory load per teacher per day.
	student_conflict:
		enabled: true
		priority: 10
		weight: 1.0
		description: Avoid overlap between sessions taken by the same student group.
	room_capacity:
		enabled: true
		priority: 8
		weight: 0.7
		description: Respect lecture hall capacities for all theory sessions.
	shift_alignment:
		enabled: true
		priority: 8
		weight: 0.6
		description: Align theory sessions with department shift windows.

cross_system:
	teacher_overlap:
		enabled: true
		priority: 10
		weight: 1.0
		description: Prevent teachers from being double-booked across lab and theory.
	lunch_alignment:
		enabled: true
		priority: 6
		weight: 0.4
		description: Maintain common lunch breaks to match combined scheduler defaults.
	five_pm_policy:
		enabled: true
		priority: 7
		weight: 0.5
		description: Apply department-specific no-evening scheduling rules.
		params:
			soft_penalty_weight: 5
